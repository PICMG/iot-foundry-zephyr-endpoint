name: Zephyr CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            python3-pip python3-setuptools python3-venv build-essential \
            gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Install west and update PATH
        run: |
          python3 -m pip install --user west
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"

      - name: Initialize west workspace with Zephyr
        run: |
          mkdir -p $HOME/zephyrproject
          cd $HOME/zephyrproject
          west init -m https://github.com/zephyrproject-rtos/zephyr
          west update

      - name: Debug west and environment
        run: |
          echo "=== ENV ==="
          env | grep -E 'HOME|PATH|ZEPHYR_BASE|GITHUB_PATH|RUNNER|USER' || true
          echo "=== GITHUB_PATH ==="
          cat "$GITHUB_PATH" || true
          echo "=== which west ==="
          which west || true
          echo "=== west version ==="
          west --version || true
          echo "=== west -vv status ==="
          west -vv status || true
          echo "=== Zephyr checkout listing ==="
          ls -la "$HOME/zephyrproject/zephyr" || ls -la /zephyrproject || true

      - name: Git-level diagnostics for Zephyr
        run: |
          echo "=== Zephyr git diagnostics ==="
          ZEPHYR="$HOME/zephyrproject/zephyr"
          if [ -d "$ZEPHYR/.git" ]; then
            git -C "$ZEPHYR" show-ref --tags --heads || true
            git -C "$ZEPHYR" rev-parse --verify v4.3.0 || true
            git -C "$ZEPHYR" ls-tree -r v4.3.0 --name-only | grep -E 'west.yml|west.*yml' || true
            echo "=== git HEAD and files (truncated) ==="
            git -C "$ZEPHYR" rev-parse --verify HEAD || true
            git -C "$ZEPHYR" ls-files | head -n 50 || true
          else
            echo "Zephyr checkout not found at $ZEPHYR"
          fi
          echo "=== Re-running west -vv update ==="
          west -vv update || true

      - name: Per-project git diagnostics
        run: |
          echo "=== Locating initialized project repos under workspace ==="
          WK="$GITHUB_WORKSPACE"
          find "$WK" -type d -name .git -printf '%h\n' 2>/dev/null | sort -u | while read repo; do
            echo "---- $repo ----"
            git -C "$repo" show-ref --tags --heads || true
            git -C "$repo" rev-parse --verify manifest-rev 2>/dev/null || echo "no manifest-rev"
            git -C "$repo" rev-parse --verify HEAD || true
            git -C "$repo" log -1 --pretty=oneline || true
          done
          echo "=== Searching manifests for project named 'zero' ==="
          grep -R "name: zero" "$WK" || true

      - name: Install Python requirements for Zephyr
        run: |
          export ZEPHYR_BASE=$HOME/zephyrproject/zephyr
          python3 -m pip install --user -r $ZEPHYR_BASE/scripts/requirements.txt
          export PATH="$HOME/.local/bin:$PATH"

      - name: "Build for Arduino Nano 33 IoT (board: arduino_nano_33_iot)"
        env:
          ZEPHYR_BASE: ${{ runner.home }}/zephyrproject/zephyr
          PATH: ${{ env.PATH }}:${{ runner.home }}/.local/bin
        run: |
          west build -b arduino_nano_33_iot $GITHUB_WORKSPACE -p auto

      - name: Build and run native_sim unit test
        env:
          ZEPHYR_BASE: ${{ runner.home }}/zephyrproject/zephyr
          PATH: ${{ env.PATH }}:${{ runner.home }}/.local/bin
        run: |
          west build -b native_sim tests/mctp_posix_uart_stub -p auto
          west build -t run

      - name: Build and run native pldm_tb tests
        env:
          PATH: ${{ env.PATH }}:${{ runner.home }}/.local/bin
        run: |
          mkdir -p tests/pldm_tb/build_native
          pushd tests/pldm_tb/build_native
          cmake ..
          cmake --build . -j
          ./pldm_tb ../tests.json -v
          # Run native FRU unit tests (no hardware I/O)
          if [ -x ./test_fru ]; then
            ./test_fru
          else
            echo "test_fru not built or missing"; exit 1
          fi
          popd
